name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kiểm tên, phiên bản, CHANGELOG
        run: python tools/check_skill.py
      - name: Chạy kiểm thử engine (nếu có)
        run: |
          if [ -d engine/tests ]; then python -m unittest discover -s engine/tests -v; else echo "Không có engine/tests"; fi
      - name: Thử đóng gói
        run: python tools/package.py
